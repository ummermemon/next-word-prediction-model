<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Word Predictor</title>

    <!-- Apply saved / system theme before first paint (prevents flash) -->
    <script>
        (function () {
            var theme;
            try { theme = localStorage.getItem("theme"); } catch (e) {}
            if (!theme) {
                theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="container">

        <div class="topbar">
            <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Toggle theme">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                </svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
            </button>
        </div>

        <section class="header">
            <h1>Next Word Predictor</h1>
            <p>Type a sentence and the LSTM model suggests the word that comes next.</p>
        </section>

        <section class="card">
            <label for="textInput">Your text</label>

            <textarea
                id="textInput"
                placeholder="Start typing something..."
                rows="4"
                autofocus
            ></textarea>

            <div class="actions">
                <span class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to predict</span>

                <button id="predictBtn" type="button" onclick="predictWord()">
                    <span id="loader" class="loader" aria-hidden="true"></span>
                    <span id="buttonText">Predict next word</span>
                </button>
            </div>

            <div id="result" class="result hidden" aria-live="polite">
                <div>
                    <div class="result-label">Predicted next word</div>
                    <div id="prediction" class="prediction">—</div>
                </div>
                <button id="appendBtn" class="secondary-btn" type="button" onclick="appendWord()">Add to text</button>
            </div>

            <div id="error" class="error hidden" role="alert">
                <span id="errorMessage"></span>
            </div>
        </section>

        <footer>
            Built with <strong>TensorFlow · LSTM</strong>
        </footer>

    </main>

    <script>
        /* ---------- Theme toggle ---------- */
        const root = document.documentElement;
        const themeToggle = document.getElementById("themeToggle");

        function syncToggleLabel() {
            const isDark = root.getAttribute("data-theme") === "dark";
            themeToggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
        }

        themeToggle.addEventListener("click", function () {
            const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
            root.setAttribute("data-theme", next);
            try { localStorage.setItem("theme", next); } catch (e) {}
            syncToggleLabel();
        });

        syncToggleLabel();


        /* ---------- Prediction ---------- */
        const textInput = document.getElementById("textInput");
        const predictBtn = document.getElementById("predictBtn");
        const buttonText = document.getElementById("buttonText");
        const loader = document.getElementById("loader");
        const result = document.getElementById("result");
        const prediction = document.getElementById("prediction");
        const error = document.getElementById("error");
        const errorMessage = document.getElementById("errorMessage");

        async function predictWord() {
            const text = textInput.value.trim();

            result.classList.add("hidden");
            error.classList.add("hidden");

            if (!text) {
                errorMessage.textContent = "Enter some text to get a prediction.";
                error.classList.remove("hidden");
                textInput.focus();
                return;
            }

            predictBtn.disabled = true;
            buttonText.textContent = "Predicting...";
            loader.style.display = "inline-block";

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                if (data.success) {
                    prediction.textContent = data.prediction;
                    result.classList.remove("hidden");
                } else {
                    errorMessage.textContent = data.error || "Something went wrong. Try again.";
                    error.classList.remove("hidden");
                }
            } catch (err) {
                console.error(err);
                errorMessage.textContent = "Can't reach the prediction server. Check that it's running.";
                error.classList.remove("hidden");
            } finally {
                predictBtn.disabled = false;
                buttonText.textContent = "Predict next word";
                loader.style.display = "none";
            }
        }

        function appendWord() {
            const word = prediction.textContent.trim();
            if (!word || word === "—") return;

            const current = textInput.value.replace(/\s+$/, "");
            textInput.value = current + " " + word + " ";
            result.classList.add("hidden");
            textInput.focus();
        }

        textInput.addEventListener("keydown", function (event) {
            if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
                predictWord();
            }
        });
    </script>

</body>

</html>
